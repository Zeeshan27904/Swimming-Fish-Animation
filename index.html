<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic Swimming Fish</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ocean">
    <div class="fishes">
      <div class="fish" style="--i:1;"></div>
      <div class="fish" style="--i:2;"></div>
      <div class="fish" style="--i:3;"></div>
      <div class="fish" style="--i:4;"></div>
      <div class="fish" style="--i:5;"></div>
    </div>
    <div class="bubbles"></div>
  </div>
  <div class="plants">
    <div class="plant" style="--n:1;"></div>
    <div class="plant" style="--n:2;"></div>
    <div class="plant" style="--n:3;"></div>
    <div class="plant" style="--n:4;"></div>
    <div class="plant" style="--n:5;"></div>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
